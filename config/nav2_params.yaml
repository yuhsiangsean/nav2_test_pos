# Nav2 params for indoor PX4 minimal-test navigation (no map_server/AMCL, no obstacle sensors).
# Based on the Jazzy nav2_bringup default nav2_params.yaml, trimmed to what
# navigation_launch.py actually starts, with costmaps reduced to inflation_layer only
# and the controller switched to holonomic (Omni) motion to match a quadrotor's
# ability to strafe sideways, not just drive-and-turn.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # 預設的 navigate_to_pose_w_replanning_and_recovery.xml 裡的 recovery 子樹
    # 需要 local_costmap/clear_entirely_local_costmap 這個 service，但這個專案
    # 的 controller_server(position_controller.py)沒有實作 costmap，service
    # 不存在，bt_navigator 載入時會直接丟例外整個起不來。改用
    # navigate_w_replanning_time.xml：只有 ComputePathToPose -> FollowPath，
    # 完全不碰 costmap/IsPathValid。
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    # navigate_through_poses 先拿掉：它預設的行為樹
    # (navigate_through_poses_w_replanning_and_recovery.xml) 一樣需要
    # local_costmap/clear_entirely_local_costmap，這個專案沒有 costmap。
    # 目前只測單一目標點(NavigateToPose)用不到多點依序導航，之後真的需要
    # navigate_through_poses 時，要嘛寫一個不碰 costmap 的自訂行為樹，要嘛把
    # local costmap 補回來。
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# controller_server 原本這裡的 MPPI/progress_checker/goal_checker 參數整段拿掉了。
# 這個專案的 controller_server 不是 nav2_controller 執行檔，是
# nav2_test_pos/position_controller.py 自己寫的 FollowPath action server，
# 不吃 nav2_core::Controller 的 plugin 參數框架，自己的參數（waypoint_tolerance、
# xy_goal_tolerance、required_movement_radius、movement_time_allowance、
# fence_x/y_min/max 等）直接在 bridge_launch.py 用 launch argument 傳進去，
# 不是透過這份 params 檔案。

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.25
      resolution: 0.05
      rolling_window: true
      width: 12
      height: 12
      track_unknown_space: false
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# velocity_smoother 整個拿掉了：它是用來平滑 /cmd_vel 速度指令的，這個專案改成
# position_controller.py 直接送位置 setpoint 給 PX4，不再有 /cmd_vel 這條線，
# velocity_smoother 沒有東西可以處理。

# collision_monitor、route_server、docking_server 這個專案也用不到，沒有啟動，
# 原因同 px4_nav2_bridge（沒有 /scan、沒有圖形路由/充電對接需求）。
