# ROS2 Humble 版本的 nav2_params.yaml。
#
# 跟 nav2_params.yaml 唯一的差異：pluginlib 的 plugin 名稱格式。Jazzy 這份 Nav2
# (1.3.12) 的 pluginlib XML 沒有寫 name 屬性，lookup name 預設等於 type，所以用
# C++ 的 "pkg::Class" 格式（例如 "nav2_navfn_planner::NavfnPlanner"）；Humble
# 的 Nav2 還是舊式寫法，pluginlib XML 明確用 "pkg/Class"（斜線）當 lookup name，
# 混用會在 configure 階段直接 FATAL："does not exist. Declared types are
# nav2_navfn_planner/NavfnPlanner ..."。這份檔案把所有受影響的 plugin 名稱改成
# 斜線格式，其餘參數跟 nav2_params.yaml 一模一樣。
#
# 使用：啟動時加 params_file 覆寫，例如：
#   ros2 launch nav2_test_pos bridge_launch.py \
#     params_file:=$(ros2 pkg prefix nav2_test_pos)/share/nav2_test_pos/config/nav2_params_humble.yaml \
#     topic_odometry:=/MAV1/fmu/out/vehicle_odometry ...

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # 同 nav2_params.yaml 的理由：這個專案的 controller_server 沒有 costmap，
    # 預設行為樹需要的 local_costmap/clear_entirely_local_costmap service 不存在。
    # 路徑換成 Humble 的 share 目錄（Jazzy 那份寫死 /opt/ros/jazzy/...，Humble
    # 機器上不存在）。
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# controller_server 原本這裡的 MPPI/progress_checker/goal_checker 參數整段拿掉了。
# 這個專案的 controller_server 不是 nav2_controller 執行檔，是
# nav2_test_pos/position_controller.py 自己寫的 FollowPath action server，
# 不吃 nav2_core::Controller 的 plugin 參數框架，自己的參數（waypoint_tolerance、
# xy_goal_tolerance、required_movement_radius、movement_time_allowance、
# fence_x/y_min/max 等）直接在 bridge_launch.py 用 launch argument 傳進去，
# 不是透過這份 params 檔案。

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.25
      resolution: 0.05
      rolling_window: true
      width: 12
      height: 12
      track_unknown_space: false
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother/SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower/WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# velocity_smoother 整個拿掉了：它是用來平滑 /cmd_vel 速度指令的，這個專案改成
# position_controller.py 直接送位置 setpoint 給 PX4，不再有 /cmd_vel 這條線，
# velocity_smoother 沒有東西可以處理。

# collision_monitor、route_server、docking_server 這個專案也用不到，沒有啟動，
# 原因同 px4_nav2_bridge（沒有 /scan、沒有圖形路由/充電對接需求）。
